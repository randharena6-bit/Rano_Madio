[project]
name = "ranomadio-ia"
version = "0.1.0"
description = "Service IA pour RanoMadio Map : classification, deduplication et matching semantique"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sentence-transformers>=3.3",
    "numpy>=2.1",
    "httpx>=0.27",
    "structlog>=24.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30",
    "geoalchemy2>=0.16",
    "sqlalchemy[asyncio]>=2.0",
]
audio = [
    "faster-whisper>=1.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ranomadio_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "ASYNC"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: tests necessitant des services externes",
]

[tool.coverage.run]
source = ["src/ranomadio_ai"]
omit = ["*/__main__.py", "*/main.py"]